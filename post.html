<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    .post-page { padding: 20px; }
    .midia video {
      width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin-top: 40px;
    }
    .relato {
      margin-top: 20px;
      background-color: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
    }
    #relato {
      word-break: break-word;
      white-space: pre-wrap;
    }
    .interacoes {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #ccc;
    }
    .comentarios {
      margin-top: 20px;
      background-color: #222;
      padding: 15px;
      border-radius: 10px;
    }
    .comentarios h3 {
      margin-bottom: 15px;
    }
    .lista-comentarios .comentario {
      background-color: #fff;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      position: relative;
    }
    .texto-comentario {
      word-break: break-word;
      white-space: pre-wrap;
    }
    .conteudo-comentario {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .avatar {
      background-color: #1c1c1c;
      color: white;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .comentario .acoes {
      margin-top: 8px;
      display: flex;
      gap: 15px;
      font-size: 14px;
    }
    .comentario .acoes span {
      cursor: pointer;
      transition: color 0.2s;
    }
    .comentario .acoes span:hover {
      color: #d62828;
    }
    .comentario .pontos {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 12px;
      background-color: #444;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .caixa-comentario {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .caixa-comentario input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }
    .caixa-comentario button {
      padding: 10px 20px;
      background-color: #d62828;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="post-page">
    <section class="publicacao">
      <h2 class="tema" id="titulo">Carregando título...</h2>
      <div class="midia" id="midia">Carregando mídia...</div>

      <div class="relato">
        <h3>Relato:</h3>
        <p id="relato">Carregando relato...</p>
      </div>
      <div class="interacoes">
        <span>👁 2M</span>
        <span>❤️ 129</span>
        <span>😂 52</span>
      </div>
    </section>

    <section class="comentarios">
      <h3>Comentários</h3>
      <div class="lista-comentarios" id="lista-comentarios"></div>
      <div class="caixa-comentario">
        <input type="text" id="campo-comentario" placeholder="Escreva seu comentário...">
        <button id="botao-enviar">Enviar</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import {
      getFirestore, doc, getDoc, collection, addDoc,
      onSnapshot, updateDoc, increment
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SUA_AUTH_DOMAIN",
      projectId: "opinion-b3435",
      storageBucket: "opinion-b3435.appspot.com",
      messagingSenderId: "815007553160",
      appId: "1:815007553160:web:5253161c91e9384e53313d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    const tituloEl = document.getElementById("titulo");
    const relatoEl = document.getElementById("relato");
    const midiaDiv = document.getElementById("midia");
    const lista = document.getElementById("lista-comentarios");
    const campo = document.getElementById("campo-comentario");
    const botao = document.getElementById("botao-enviar");

    let usuarioAtual = null;

    onAuthStateChanged(auth, async (user) => {
      usuarioAtual = user;

      if (!postId) {
      alert("Conteúdo não encontrado.");
      return;
      }

      // 1. Buscar dados do post
      const docRef = doc(db, "conteudos", postId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        tituloEl.innerText = data.titulo || "Sem título";
        relatoEl.innerText = data.relato || "Sem relato";
        midiaDiv.innerHTML = "";

        if (data.link && data.link.includes(".mp4")) {
          const video = document.createElement("video");
          video.src = data.link;
          video.controls = true;
          midiaDiv.appendChild(video);
        } else if (data.link && /\.(jpg|jpeg|png)$/i.test(data.link)) {
          const img = document.createElement("img");
          img.src = data.link;
          img.style.maxWidth = "100%";
          img.style.borderRadius = "8px";
          midiaDiv.appendChild(img);
        } else {
          midiaDiv.innerText = "Sem mídia válida.";
        }
      } else {
        alert("Conteúdo não encontrado.");
        return;
      }

      // 2. Comentários
      const comentariosRef = collection(db, "conteudos", postId, "comentarios");

      onSnapshot(comentariosRef, (snapshot) => {
        lista.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;

          const div = document.createElement("div");
          div.className = "comentario";
          div.innerHTML = `
            <div class="conteudo-comentario">
              <div class="avatar">${data.nome ? data.nome[0].toUpperCase() : "U"} </div>
              <div class="texto-comentario">${data.texto}</div>
            </div>

            <div class="acoes">
              <span onclick="reagir('${id}', 'coracao')">❤️ <b>${data.reacoes?.coracao || 0}</b></span>
              <span onclick="reagir('${id}', 'risada')">😂 <b>${data.reacoes?.risada || 0}</b></span>
              <span onclick="recompensar('${id}')">💰</span>
            </div>
            <div class="pontos">: <b>${data.reacoes?.pontos || 0}</b></div>
          `;
          lista.appendChild(div);
        });
    });

    // 3. Enviar comentário
    botao.addEventListener("click", async () => {
      const texto = campo.value.trim();
      if (!texto) return;

      if (!usuarioAtual) {
        alert("Você precisa estar logado para comentar.");
        return;
      }

      const nome = usuarioAtual.displayName || usuarioAtual.email || "Usuário";
      const uid = usuarioAtual.uid;

      const comentario = {
        texto,
        nome,
        uid,
        postId,
        criadoEm: new Date(),
        reacoes: { coracao: 0, risada: 0, pontos: 0 }
      };

    // Salvar nos comentários do conteúdo
      await addDoc(collection(db, "conteudos", postId, "comentarios"), comentario);

    // Salvar também no perfil do usuário
      await addDoc(collection(db, "usuarios", uid, "comentariosFeitos"), comentario);

      campo.value = "";
    });
    });

    // 4. Reações (fora do onAuthStateChanged para funcionar no escopo global)
    window.reagir = async (comentarioId, tipo) => {
      const ref = doc(db, "conteudos", postId, "comentarios", comentarioId);
      await updateDoc(ref, {
        [`reacoes.${tipo}`]: increment(1)
      });
    };

    window.recompensar = async (comentarioId) => {
      const valores = [5, 10, 15];
      const escolha = prompt("Quantos pontos deseja enviar? (5, 10 ou 15)");
      const valor = parseInt(escolha);
      if (valores.includes(valor)) {
        const ref = doc(db, "conteudos", postId, "comentarios", comentarioId);
        await updateDoc(ref, {
          "reacoes.pontos": increment(valor)
        });
      } else {
        alert("Valor inválido. Digite 5, 10 ou 15.");
      }
    };
  </script>
</body>
</html>
